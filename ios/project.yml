# XcodeGen 스펙 — `brew install xcodegen` 후 ios/ 에서 `xcodegen generate` 실행하면
# MoimTalk.xcodeproj 가 생성됩니다. (수동 Xcode 설정은 README.md 참고)
name: MoimTalk
options:
  bundleIdPrefix: com.example.moimtalk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  MoimTalk:
    type: application
    platform: iOS
    sources:
      - MoimTalk
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moimtalk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 모임톡
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
