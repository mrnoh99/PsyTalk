name: CI

# 빌드 검증 — 클라우드(Linux) 개발 환경에선 Android SDK·Xcode 가 없어 빌드 확인이 안 되므로 여기서 확인합니다.
#  · iOS     : macOS 러너에서 커밋된 MoimTalk.xcodeproj 를 시뮬레이터용으로 빌드(서명 없음)
#  · Android : ./gradlew assembleDebug (keystore 없이 디버그 빌드)
# 관련 폴더가 바뀐 경우에만 해당 잡이 의미 있지만, 단순하게 두 잡 모두 실행합니다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 버전
        run: xcodebuild -version
      - name: Build (Simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project MoimTalk.xcodeproj \
            -scheme MoimTalk \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # gradle/gradle-daemon-jvm.properties 의 toolchainVersion
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug
