# XcodeGen 스펙 — `brew install xcodegen` 후 ios/ 에서 `xcodegen generate` 실행하면
# MoimTalk.xcodeproj 가 생성됩니다. (수동 Xcode 설정은 README.md 참고)
name: MoimTalk
options:
  bundleIdPrefix: com.example.moimtalk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    from: "5.0.0"
targets:
  MoimTalk:
    type: application
    platform: iOS
    sources:
      - MoimTalk
    entitlements:
      path: MoimTalk/MoimTalk.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: Supabase
        product: Supabase
      - package: OneSignal
        product: OneSignalFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moimtalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 아주 정신
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
